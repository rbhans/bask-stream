# Builds the bask CLI for Windows, macOS and Linux and publishes a GitHub release.
#
# Release: bump cli/package.json "version", commit, then push a matching tag:
#   git tag bask-v0.1.0 && git push origin bask-v0.1.0
# "Run workflow" on the Actions tab builds and tests without releasing.
name: Release bask CLI

on:
  push:
    tags: ["bask-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Protocol contract
        run: python3 tests/protocol_contract.py
      - name: SDK tests
        working-directory: sdk
        run: npm ci && npm test
      - name: CLI tests
        working-directory: cli
        run: npm ci && npm test
      - name: Tag matches cli/package.json
        if: startsWith(github.ref, 'refs/tags/bask-v')
        run: |
          version="$(node -p "require('./cli/package.json').version")"
          if [ "bask-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match cli/package.json version $version" >&2
            exit 1
          fi

  build:
    needs: test
    strategy:
      matrix:
        include:
          # x64 "baseline" builds run on older CPUs without AVX2.
          - runner: ubuntu-latest
            targets: "bun-linux-x64-baseline:bask-linux-x64 bun-linux-arm64:bask-linux-arm64 bun-windows-x64-baseline:bask-windows-x64.exe"
          - runner: macos-latest
            targets: "bun-darwin-arm64:bask-darwin-arm64 bun-darwin-x64:bask-darwin-x64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Build SDK and CLI
        run: |
          (cd sdk && npm ci && npm run build)
          (cd cli && npm ci && npm run build)
      - name: Compile executables
        working-directory: cli
        run: |
          mkdir -p ../out
          for pair in ${{ matrix.targets }}; do
            target="${pair%%:*}"; name="${pair##*:}"
            bun scripts/compile.mjs --target="$target" --outfile="../out/$name"
          done
      - name: Sign macOS executables (ad hoc)
        if: runner.os == 'macOS'
        run: |
          for f in out/bask-darwin-*; do codesign --force --sign - "$f"; done
          out/bask-darwin-arm64 --version
      - name: Smoke test
        if: runner.os == 'Linux'
        run: out/bask-linux-x64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: bask-${{ matrix.runner }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/bask-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum bask-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#bask-v}"
          cat > notes.md <<EOF
          bask $version: command line and terminal dashboard for baskStream on Niagara 4 stations.

          **Install**

          macOS / Linux:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/cli/install.sh | sh
          \`\`\`

          Windows (PowerShell):
          \`\`\`powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/cli/install.ps1 | iex
          \`\`\`

          Then \`bask login https://<station> -u <user> --insecure\` and \`bask\`.
          EOF
          gh release create "$GITHUB_REF_NAME" out/* --title "bask $version" --notes-file notes.md
